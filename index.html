<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IIDX DP KAIDEN</title>
    <style>
        :root {
            --color-np: #666666;
            --color-f: #ff3333;
            --color-ae: #cc33ff;
            --color-e: #33ff33;
            --color-n: #33ccff;
            --color-hard: #ff5500;
            --color-exh: #ffcc00;
            --color-fc: #00ffcc;
            --bg-color: #0d0f12;
            --panel-bg: rgba(30, 35, 45, 0.7);
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at 50% 0%, #1a2332 0%, #0d0f12 60%);
            background-attachment: fixed;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .fixed-top-area {
            padding: 15px 15px 0 15px;
            flex-shrink: 0;
            z-index: 10;
        }

        .scrollable-list-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px 15px 15px;
            -webkit-overflow-scrolling: touch;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        /* 最終更新日表示用に追加 */
        .header-title-area {
            display: flex;
            flex-direction: column;
        }
        .header-title-area h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }
        .header-title-area .last-updated {
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-export {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-export:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .dashboard-container {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .chart-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            flex-shrink: 0;
        }
        .donut-chart {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(var(--color-np) 0% 100%);
            -webkit-mask-image: radial-gradient(circle, transparent 55%, black 56%);
            mask-image: radial-gradient(circle, transparent 55%, black 56%);
            transition: background 0.5s ease-out;
        }
        .chart-center-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            line-height: 1.2;
        }
        .chart-center-text .val {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        .chart-center-text .lbl {
            font-size: 10px;
            color: #aaa;
        }
        .chart-legend {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 5px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #ddd;
        }
        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .search-box, .filter-select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .preset-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }
        .filter-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #33ccff;
            color: #33ccff;
            padding: 8px 15px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:active {
            transform: scale(0.95);
        }

        .list-summary {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }
        .song-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .song-info h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
        }
        .song-info p {
            margin: 0;
            font-size: 12px;
            color: #aaa;
        }
        .lamp-indicator {
            width: 8px;
            height: 40px;
            border-radius: 4px;
            background: var(--color-np);
        }

        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: rgba(20, 25, 30, 0.95);
            backdrop-filter: blur(10px);
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 20px;
            box-sizing: border-box;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }
        .bottom-sheet.active {
            bottom: 0;
        }
        .sheet-title {
            text-align: center;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }
        .song-title-display {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .lamp-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .lamp-btn {
            aspect-ratio: 1;
            border-radius: 50%;
            background: transparent;
            border: 2px solid #555;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .lamp-np { border-color: var(--color-np); color: var(--color-np); }
        .lamp-f { border-color: var(--color-f); color: var(--color-f); box-shadow: 0 0 10px rgba(255,51,51,0.5); }
        .lamp-ae { border-color: var(--color-ae); color: var(--color-ae); box-shadow: 0 0 10px rgba(204,51,255,0.5); }
        .lamp-e { border-color: var(--color-e); color: var(--color-e); box-shadow: 0 0 10px rgba(51,255,51,0.5); }
        .lamp-n { border-color: var(--color-n); color: var(--color-n); box-shadow: 0 0 10px rgba(51,204,255,0.5); }
        .lamp-hard { border-color: var(--color-hard); color: var(--color-hard); box-shadow: 0 0 10px rgba(255,85,0,0.5); }
        .lamp-exh { border-color: var(--color-exh); color: var(--color-exh); box-shadow: 0 0 15px rgba(255,204,0,0.6); }
        .lamp-fc { border-color: var(--color-fc); color: var(--color-fc); box-shadow: 0 0 15px rgba(0,255,204,0.6); }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 99;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div class="fixed-top-area">
        <div class="header">
            <!-- タイトルと最終更新日をグループ化 -->
            <div class="header-title-area">
                <h1>DP CLEARMANAGER</h1>
                <div class="last-updated" id="lastUpdatedDisplay">難易度表 最終更新: 取得中...</div>
            </div>
            <div class="header-buttons">
                <button class="btn-export" style="background: rgba(0, 255, 204, 0.1); border-color: rgba(0, 255, 204, 0.3);" onclick="document.getElementById('importFile').click()">読込</button>
                <input type="file" id="importFile" accept=".csv" style="display: none;" onchange="importCSV(event)">
                <button class="btn-export" onclick="exportCSV()">保存</button>
            </div>
        </div>

        <div class="dashboard-container">
            <div class="chart-wrapper">
                <div class="donut-chart" id="lampChart"></div>
                <div class="chart-center-text">
                    <div class="lbl">CLEAR</div>
                    <div class="val" id="chartClearRate">0%</div>
                </div>
            </div>
            <div class="chart-legend" id="chartLegend"></div>
        </div>

        <input type="text" class="search-box" placeholder="曲名で検索..." id="searchInput" oninput="applyFilters()">

        <div class="preset-filters">
            <button class="filter-btn" onclick="applyPreset('ALL', 'NOT_CLEAR')">未クリア</button>
            <button class="filter-btn" style="border-color:#ffcc00; color:#ffcc00;" onclick="applyPreset('11.0_11.8', 'NOT_CLEAR')">12.0未満 未クリア</button>
            <button class="filter-btn" style="border-color:#cc33ff; color:#cc33ff;" onclick="applyPreset('12.0_OVER', 'NOT_CLEAR')">12.0以上 挑戦</button>
        </div>

        <div class="filter-group">
            <select id="filterLevel" class="filter-select" onchange="applyFilters()">
                <option value="ALL">非公式 全て</option>
            </select>
            <select id="filterLamp" class="filter-select" onchange="applyFilters()">
                <option value="ALL">ランプ 全て</option>
                <option value="NOT_CLEAR">未クリア (NP/F/AE)</option>
                <option value="NOT_HARD">未難 (NP/F/AE/E/N)</option>
                <option value="NOT_EXH">未EXH (HARD以下)</option>
                <option value="CLEAR">クリア済 (E/N)</option>
                <option value="HARD">HARD以上</option>
                <option value="EXH">EXH以上</option>
            </select>
        </div>

        <div class="list-summary" id="listSummary">読み込み中...</div>
    </div>

    <div class="scrollable-list-area">
        <div class="song-list" id="songList"></div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-title">ランプ更新</div>
        <div class="song-title-display" id="popupSongTitle"></div>
        <div class="lamp-buttons">
            <button class="lamp-btn lamp-np" onclick="updateLamp('NP')">NP</button>
            <button class="lamp-btn lamp-f" onclick="updateLamp('F')">F</button>
            <button class="lamp-btn lamp-ae" onclick="updateLamp('AE')">AE</button>
            <button class="lamp-btn lamp-e" onclick="updateLamp('E')">E</button>
            <button class="lamp-btn lamp-n" onclick="updateLamp('N')">N</button>
            <button class="lamp-btn lamp-hard" onclick="updateLamp('HARD')">HARD</button>
            <button class="lamp-btn lamp-exh" onclick="updateLamp('EXH')">EXH</button>
            <button class="lamp-btn lamp-fc" onclick="updateLamp('FC')">FC</button>
        </div>
    </div>

    <script>
        let songs = [];
        let userLamps = JSON.parse(localStorage.getItem('iidx_dp_lamps')) || {};
        let currentEditingId = null;

        const lampRank = { 'NP': 0, 'F': 1, 'AE': 2, 'E': 3, 'N': 4, 'HARD': 5, 'EXH': 6, 'FC': 7 };
        
        const lampColors = {
            'NP': '#666666', 'F': '#ff3333', 'AE': '#cc33ff', 'E': '#33ff33',
            'N': '#33ccff', 'HARD': '#ff5500', 'EXH': '#ffcc00', 'FC': '#00ffcc'
        };

        const officialLampMap = {
            'FULLCOMBO CLEAR': 'FC', 'EX HARD CLEAR': 'EXH', 'HARD CLEAR': 'HARD',
            'CLEAR': 'N', 'EASY CLEAR': 'E', 'ASSIST CLEAR': 'AE',
            'FAILED': 'F', 'NO PLAY': 'NP', '---': 'NP'
        };

        async function init() {
            try {
                const res = await fetch('master_data.json');
                const data = await res.json();
                
                // 新しいJSON構造に対応 (オブジェクトか配列かで分岐)
                if (Array.isArray(data)) {
                    songs = data;
                    document.getElementById('lastUpdatedDisplay').innerText = '難易度表 最終更新: (旧フォーマット)';
                } else {
                    songs = data.songs;
                    document.getElementById('lastUpdatedDisplay').innerText = `難易度表 最終更新: ${data.last_updated || '不明'}`;
                }

                populateLevelFilter();
                applyFilters();
            } catch (error) {
                document.getElementById('songList').innerHTML = `<p style="color:red; text-align:center;">master_data.jsonの読み込みに失敗しました。</p>`;
                document.getElementById('lastUpdatedDisplay').innerText = '通信エラー';
            }
        }

        function populateLevelFilter() {
            const levelSelect = document.getElementById('filterLevel');
            const levels = [...new Set(songs.map(s => s.level))].sort((a, b) => a - b);
            
            levelSelect.innerHTML = '<option value="ALL">非公式 全て</option>';
            levelSelect.innerHTML += '<option value="12.0_OVER">☆12 (12.0以上)</option>';
            
            levels.forEach(lv => {
                const option = document.createElement('option');
                const displayLv = Number.isInteger(lv) ? lv.toFixed(1) : lv;
                option.value = lv;
                option.textContent = `非公式 ${displayLv}`;
                levelSelect.appendChild(option);
            });
        }

        function applyFilters() {
            const searchWord = document.getElementById('searchInput').value.trim().toLowerCase();
            const filterLv = document.getElementById('filterLevel').value;
            const filterLamp = document.getElementById('filterLamp').value;

            const filteredSongs = songs.filter(s => {
                const lamp = userLamps[s.id] || 'NP';
                const rank = lampRank[lamp];

                if (searchWord && !s.title.toLowerCase().startsWith(searchWord)) return false;

                if (filterLv !== 'ALL') {
                    if (filterLv === '12.0_OVER') {
                        if (s.level < 12.0) return false;
                    } else if (filterLv.includes('_')) {
                        const [minLv, maxLv] = filterLv.split('_').map(Number);
                        if (s.level < minLv || s.level > maxLv) return false;
                    } else if (s.level !== parseFloat(filterLv)) {
                        return false;
                    }
                }

                if (filterLamp !== 'ALL') {
                    if (filterLamp === 'NOT_CLEAR' && rank >= 3) return false;
                    if (filterLamp === 'NOT_HARD' && rank >= 5) return false;
                    if (filterLamp === 'NOT_EXH' && rank >= 6) return false;
                    if (filterLamp === 'CLEAR' && (rank < 3 || rank >= 5)) return false;
                    if (filterLamp === 'HARD' && rank < 5) return false;
                    if (filterLamp === 'EXH' && rank < 6) return false;
                }

                return true;
            });

            renderList(filteredSongs);
            updateDashboard(filterLv);
        }

        function applyPreset(levelVal, lampVal) {
            const levelSelect = document.getElementById('filterLevel');
            const lampSelect = document.getElementById('filterLamp');
            
            let optionExists = false;
            for (let i = 0; i < levelSelect.options.length; i++) {
                if (levelSelect.options[i].value === levelVal) {
                    optionExists = true; break;
                }
            }
            if (!optionExists) {
                const newOption = document.createElement('option');
                newOption.value = levelVal;
                if (levelVal.includes('_') && levelVal !== '12.0_OVER') {
                    const [min, max] = levelVal.split('_');
                    newOption.textContent = `非公式 ${min} 〜 ${max}`;
                } else {
                    newOption.textContent = `特殊フィルタ`;
                }
                levelSelect.appendChild(newOption);
            }
            levelSelect.value = levelVal;
            lampSelect.value = lampVal;
            applyFilters();
        }

        function renderList(targetSongs) {
            const listEl = document.getElementById('songList');
            const summaryEl = document.getElementById('listSummary');
            listEl.innerHTML = '';
            summaryEl.textContent = `${targetSongs.length} 曲表示中 (全 ${songs.length} 曲)`;

            targetSongs.forEach(song => {
                const lamp = userLamps[song.id] || 'NP';
                const div = document.createElement('div');
                div.className = 'song-card';
                let lampColor = `var(--color-${lamp.toLowerCase()})`;
                if(lamp === 'NP') lampColor = '#333';

                const displayLv = Number.isInteger(song.level) ? song.level.toFixed(1) : song.level;
                
                div.innerHTML = `
                    <div class="song-info">
                        <h3 style="color: ${lamp !== 'NP' ? lampColor : '#fff'}">${song.title}</h3>
                        <p>☆${song.official_level} / 非公式 ${displayLv} (${lamp})</p>
                    </div>
                    <div class="lamp-indicator" style="background: ${lampColor}; box-shadow: 0 0 10px ${lampColor};"></div>
                `;
                
                div.onclick = () => openSheet(song.id, song.title);
                listEl.appendChild(div);
            });
        }

        function updateDashboard(filterLv) {
            const targetSongs = songs.filter(s => {
                if (filterLv !== 'ALL') {
                    if (filterLv === '12.0_OVER') {
                        if (s.level < 12.0) return false;
                    } else if (filterLv.includes('_')) {
                        const [minLv, maxLv] = filterLv.split('_').map(Number);
                        if (s.level < minLv || s.level > maxLv) return false;
                    } else if (s.level !== parseFloat(filterLv)) {
                        return false;
                    }
                }
                return true;
            });

            const total = targetSongs.length;
            if (total === 0) return;

            const counts = { 'FC':0, 'EXH':0, 'HARD':0, 'N':0, 'E':0, 'AE':0, 'F':0, 'NP':0 };
            let clearCount = 0; 

            targetSongs.forEach(s => {
                const lamp = userLamps[s.id] || 'NP';
                counts[lamp]++;
                if (lampRank[lamp] >= 3) {
                    clearCount++;
                }
            });

            let gradientString = [];
            let currentPercent = 0;
            let legendHTML = '';

            const drawOrder = ['FC', 'EXH', 'HARD', 'N', 'E', 'AE', 'F', 'NP'];

            drawOrder.forEach(lamp => {
                const count = counts[lamp];
                const percent = (count / total) * 100;
                
                if (count > 0) {
                    gradientString.push(`${lampColors[lamp]} ${currentPercent}% ${currentPercent + percent}%`);
                    currentPercent += percent;
                }

                legendHTML += `
                    <div class="legend-item" style="opacity: ${count > 0 ? '1' : '0.4'};">
                        <div class="legend-color" style="background: ${lampColors[lamp]}; box-shadow: 0 0 5px ${lampColors[lamp]};"></div>
                        <span>${lamp}: ${count}</span>
                    </div>
                `;
            });

            document.getElementById('lampChart').style.background = `conic-gradient(${gradientString.join(', ')})`;
            
            const clearRate = Math.round((clearCount / total) * 100);
            document.getElementById('chartClearRate').innerText = `${clearRate}%`;
            
            document.getElementById('chartLegend').innerHTML = legendHTML;
        }

        const sheet = document.getElementById('bottomSheet');
        const overlay = document.getElementById('overlay');
        const titleDisplay = document.getElementById('popupSongTitle');

        function openSheet(id, title) {
            currentEditingId = id;
            titleDisplay.textContent = title;
            sheet.classList.add('active');
            overlay.classList.add('active');
        }

        overlay.onclick = () => {
            sheet.classList.remove('active');
            overlay.classList.remove('active');
        }

        function updateLamp(status) {
            if (currentEditingId) {
                userLamps[currentEditingId] = status;
                localStorage.setItem('iidx_dp_lamps', JSON.stringify(userLamps));
                applyFilters(); 
            }
            sheet.classList.remove('active');
            overlay.classList.remove('active');
        }

        function exportCSV() {
            let csvContent = "ID,曲名,公式レベル,非公式レベル,ランプ\n";
            songs.forEach(s => {
                const lamp = userLamps[s.id] || 'NP';
                csvContent += `${s.id},"${s.title}",${s.official_level},${s.level},${lamp}\n`;
            });

            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "iidx_dp_lamps.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }

        function parseCSVLine(str) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (inQuotes) {
                    if (char === '"') {
                        if (i + 1 < str.length && str[i + 1] === '"') {
                            current += '"'; i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        current += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        result.push(current); current = '';
                    } else {
                        current += char;
                    }
                }
            }
            result.push(current);
            return result;
        }

        function processOfficialCSV(lines) {
            const header = parseCSVLine(lines[0]);
            const titleIdx = header.indexOf('タイトル');
            const hyperIdx = header.indexOf('HYPER クリアタイプ');
            const anotherIdx = header.indexOf('ANOTHER クリアタイプ');
            const leggendariaIdx = header.indexOf('LEGGENDARIA クリアタイプ');

            if (titleIdx === -1) {
                alert('公式CSVのフォーマットが正しくありません。（「タイトル」列が見つかりません）');
                return;
            }

            const csvData = {};
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const cols = parseCSVLine(line);
                if (cols.length > titleIdx) {
                    csvData[cols[titleIdx]] = cols;
                }
            }

            let updateCount = 0;

            songs.forEach(song => {
                let baseTitle = song.title;
                let diffType = '';
                
                const suffixIdx = song.title.lastIndexOf(' [');
                if (suffixIdx !== -1) {
                    baseTitle = song.title.substring(0, suffixIdx);
                    diffType = song.title.substring(suffixIdx + 2, song.title.length - 1);
                }

                const row = csvData[baseTitle];
                if (row) {
                    let offLampStr = null;
                    if (diffType === 'H' && hyperIdx !== -1) offLampStr = row[hyperIdx];
                    else if (diffType === 'A' && anotherIdx !== -1) offLampStr = row[anotherIdx];
                    else if (diffType === 'L' && leggendariaIdx !== -1) offLampStr = row[leggendariaIdx];

                    if (offLampStr) {
                        const newLamp = officialLampMap[offLampStr];
                        if (newLamp && newLamp !== 'NP') { 
                            userLamps[song.id] = newLamp;
                            updateCount++;
                        }
                    }
                }
            });

            localStorage.setItem('iidx_dp_lamps', JSON.stringify(userLamps));
            applyFilters();
            alert(`公式プレイデータから ${updateCount} 譜面のランプを同期・更新しました！`);
        }

        function processBackupCSV(lines) {
            const newLamps = {};
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const firstCommaIdx = line.indexOf(',');
                const lastCommaIdx = line.lastIndexOf(',');
                if (firstCommaIdx !== -1 && lastCommaIdx !== -1 && firstCommaIdx !== lastCommaIdx) {
                    const id = line.substring(0, firstCommaIdx);
                    const lamp = line.substring(lastCommaIdx + 1);
                    newLamps[id] = lamp;
                }
            }
            userLamps = newLamps;
            localStorage.setItem('iidx_dp_lamps', JSON.stringify(userLamps));
            applyFilters();
            alert('バックアップデータの復元が完了しました！');
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!confirm('データを読み込みます。既存のランプ状態は上書き更新されます。よろしいですか？')) {
                event.target.value = ''; 
                return;
            }

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const buffer = e.target.result;
                
                let text = new TextDecoder('utf-8').decode(buffer);
                let lines = text.split(/\r\n|\n/);
                
                if (lines[0] && lines[0].startsWith('ID')) {
                    processBackupCSV(lines);
                    event.target.value = '';
                    return;
                }

                text = new TextDecoder('shift-jis').decode(buffer);
                lines = text.split(/\r\n|\n/);

                if (lines[0] && lines[0].includes('タイトル')) {
                    processOfficialCSV(lines);
                } else {
                    alert('対応していないファイル形式です。\n当アプリのバックアップファイル、またはe-amusement公式のプレイデータCSVを選択してください。');
                }
                
                event.target.value = '';
            };
            
            reader.readAsArrayBuffer(file);
        }

        init();
    </script>
</body>
